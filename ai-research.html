let messages = [];

// ════════════════════════════════════════════════════════════════════
// RENDER HELPERS
// ════════════════════════════════════════════════════════════════════
function renderAnswer(text) {
  // Convert [EV-XXX] citations to clickable chips
  return text
    .replace(/\[EV-(\d+)\]/g, function(_, n) {
      var id = 'ev-' + n.padStart(3,'0');
      return '<a class="ev-chip" href="https://thelinkpanda.com/evidence/' + id + '" target="_blank" rel="noopener">' + id.toUpperCase() + '</a>';
    })
    .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--w)">$1</strong>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .split('\n\n').map(function(p) {
      return p.trim() ? '<p>' + p.trim() + '</p>' : '';
    }).join('');
}

function addMessage(role, content, isHTML) {
  var container = document.getElementById('chat-messages');
  var welcome = document.getElementById('welcome-msg');
  if (welcome) welcome.remove();

  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var label = role === 'user' ? 'YOU' : 'RESEARCH ASSISTANT';
  var bubbleContent = isHTML ? content : renderAnswer(content);
  div.innerHTML =
    '<span class="msg-role">' + label + '</span>' +
    '<div class="msg-bubble">' + bubbleContent + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showThinking() {
  var container = document.getElementById('chat-messages');
  var div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking-indicator';
  div.innerHTML = '<div class="dot-pulse"><span></span><span></span><span></span></div><span>Searching evidence vault…</span>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeThinking() {
  var el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

// API CALL
// ════════════════════════════════════════════════════════════════════
async function callClaude(userMessage) {
  messages.push({ role: 'user', content: userMessage });

  if (!PROXY_URL || PROXY_URL.includes('YOUR-NAME')) {
    throw new Error('Proxy not configured. Deploy the Cloudflare Worker first and set PROXY_URL.');
  }

  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: messages
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || 'API error ' + response.status);
  }

  const data = await response.json();
  const assistantText = data.content
    .filter(function(b) { return b.type === 'text'; })
    .map(function(b) { return b.text; })
    .join('');

  messages.push({ role: 'assistant', content: assistantText });
  return assistantText;
}

async function sendMessage() {
  if (isLoading) return;
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text) return;

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', text, false);
  showThinking();

  try {
    var answer = await callClaude(text);
    removeThinking();
    addMessage('assistant', answer, false);
  } catch (err) {
    removeThinking();
    var container = document.getElementById('chat-messages');
    var errDiv = document.createElement('div');
    errDiv.className = 'error-msg';
    errDiv.textContent = 'Error: ' + err.message + '. Please try again.';
    container.appendChild(errDiv);
    container.scrollTop = container.scrollHeight;
    // Remove the failed user message from history so it can be retried
    messages.pop();
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}
